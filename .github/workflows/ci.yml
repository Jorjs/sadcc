name: CI

on:
  push:
    branches: [ master ]

permissions:
  contents: write   # to commit the version bump and push the tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        run: mvn -B clean verify

      # pom.xml holds the version. Not semver yet (1.0-SNAPSHOT) => start at 1.0.0.
      - name: Bump patch version
        run: |
          current=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            && VERSION="${current%.*}.$(( ${current##*.} + 1 ))" \
            || VERSION="1.0.0"
          mvn -B -q versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build & push image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/simple-java-maven-app
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker build -t $IMAGE:$VERSION -t $IMAGE:latest .
          docker push -a $IMAGE

      # Pull from Docker Hub (not the local build cache) so this tests the
      # published image. The app prints one line and exits, so "running" means
      # correct stdout and exit code 0.
      - name: Verify published image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/simple-java-maven-app
          docker image rm -f $IMAGE:$VERSION $IMAGE:latest
          docker pull $IMAGE:$VERSION
          docker run --rm $IMAGE:$VERSION | tee out.log
          grep -q "Hello World!" out.log

      - name: Commit version bump
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "ci: release $VERSION [skip ci]"
          git tag -a v$VERSION -m "Release $VERSION"
          git push origin HEAD:${{ github.ref_name }} --follow-tags
